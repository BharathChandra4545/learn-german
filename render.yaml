services:
  - type: web
    name: bharath-german-practice
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed_database.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
