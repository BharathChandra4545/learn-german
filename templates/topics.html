{% extends "base.html" %}{% block title %}{{ level }} Vocabulary{% endblock %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><span class="eyebrow">{{ level }} LEVEL</span><h1>{{ level }} Vocabulary</h1></div><a href="/search" class="btn btn-outline-primary"><i class="bi bi-search"></i> Search</a></div>
<div class="row g-3">{% for topic in topics %}<div class="col-md-6 col-lg-4"><div class="topic-card"><h5>{{ topic.name }}</h5><span>{{ topic.word_count }} questions</span><div class="mt-3"><a href="/vocabulary/topic/{{ topic.id }}" class="btn btn-sm btn-outline-primary">View words</a><a href="/vocabulary/quiz/{{ topic.id }}" class="btn btn-sm btn-primary float-end">Practice</a></div></div></div>{% endfor %}</div>
{% endblock %}
