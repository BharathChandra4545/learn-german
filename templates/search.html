{% extends "base.html" %}{% block content %}<h1>🔎 Vocabulary Search</h1><form class="input-group my-4"><input name="q" value="{{ q }}" class="form-control form-control-lg" placeholder="Search German word, English meaning or topic"><button class="btn btn-primary">Search</button></form><div class="row g-3">{% for word in results %}<div class="col-md-6 col-lg-4"><a class="word-card d-block" href="/word/{{ word.id }}"><div class="german">{{ word.article }} {{ word.german }}</div><div class="english">{{ word.english }}</div><div class="pronunciation">{{ word.pronunciation }}</div><small>{{ word.topic }} · {{ word.cefr or word.level }}</small></a></div>{% else %}<div class="empty-state">No vocabulary matches.</div>{% endfor %}</div>{% endblock %}
